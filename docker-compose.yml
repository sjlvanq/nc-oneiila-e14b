services:
  churncheck-api:
    image: ${DOCKER_USERNAME:-churncheck}/churncheck-api:${GITHUB_SHA:-latest}
    container_name: churncheck-api
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      # Base de datos H2
      DATABASE_URL: jdbc:h2:mem:churncheckdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      DB_DRIVER: org.h2.Driver
      DB_USERNAME: sa
      DB_PASSWORD: ""
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      
      # Perfil de Spring
      SPRING_PROFILES_ACTIVE: integration
      
      # Servicio ML
      ML_SERVICE_HOST: ${ML_SERVICE_HOST}
      ML_SERVICE_ENDPOINT: ${ML_SERVICE_ENDPOINT}
      ML_API_KEY: ${ML_API_KEY}
    restart: unless-stopped
    networks:
      - churncheck-network

networks:
  churncheck-network:
    driver: bridge