<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ChurnCheck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* RESET Y FIX FRANJA BLANCA */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background: linear-gradient(90deg, #0a1430, #020617);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 1000;
    }

    header img {
      height: 48px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-login {
      background: #22c55e;
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      height: 100vh;
      width: 100%;
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("img/woman.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      padding-left: 80px;
      padding-right: 40px;
      color: white;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 24px;
      color: #e5e7eb;
    }

    .hero .btn {
      display: inline-block;
      background: #22c55e;
      padding: 14px 28px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    /* FOOTER */
    footer {
      position: absolute;
      bottom: 16px;
      width: 100%;
      text-align: center;
      color: #d1d5db;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hero {
        padding-left: 32px;
        padding-right: 32px;
      }

      .hero h1 {
        font-size: 36px;
      }

      nav {
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img src="img/logo-churncheck.png" alt="ChurnCheck Logo">

    <nav>
      <a href="#">Visión</a>
      <a href="#">Misión</a>
      <a href="#">Objetivos</a>
      <a href="login.html" class="btn-login">Login</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Analítica predictiva para gimnasios</h1>
      <p>Clientes, riesgo y retención en un solo lugar</p>
      <a href="login.html" class="btn">Iniciar sesión</a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    © ChurnCheck
  </footer>

</body>
</html>
