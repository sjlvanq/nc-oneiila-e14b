<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard | ChurnCheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
}

/* HEADER */
header {
  height: 72px;
  background: linear-gradient(90deg, #0a1430, #020617);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

header img {
  height: 48px;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 24px;
  font-weight: 500;
}

nav a:hover {
  text-decoration: underline;
}

/* HERO */
.hero {
  background: linear-gradient(
    rgba(0,0,0,0.65),
    rgba(0,0,0,0.65)
  ), url("img/gym-bg.jpg") center/cover no-repeat;
  padding: 40px;
  color: white;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: white;
  color: #111;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.card h3 {
  margin: 0;
  font-size: 15px;
  color: #374151;
}

.card p {
  font-size: 26px;
  font-weight: bold;
  margin-top: 8px;
}

/* BUSCADOR */
.search-box {
  background: white;
  margin: 32px 40px;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  display: flex;
  gap: 16px;
  align-items: center;
}

.search-box input {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.search-box button {
  padding: 12px 24px;
  font-size: 16px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.search-box button:hover {
  background: #16a34a;
}

/* GRAFICOS */
.content {
  padding: 0 40px 40px;
}

.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.chart-box {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

.chart-box h2 {
  margin-bottom: 16px;
  font-size: 18px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #6b7280;
}

@media (max-width: 900px) {
  .charts {
    grid-template-columns: 1fr;
  }
  .search-box {
    margin: 24px;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <img src="img/logo-churncheck.png" alt="ChurnCheck">
  <nav>
    <a href="clientes.html">Clientes</a>
    <a href="riesgo.html">Riesgo</a>
    <a href="retencion.html">Retención</a>
    <a href="reportes.html">Reportes</a>
    <a href="index.html">Salir</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Dashboard General</h1>

  <div class="cards">
    <div class="card">
      <h3>Clientes</h3>
      <p>1,240</p>
    </div>
    <div class="card">
      <h3>En riesgo</h3>
      <p>96</p>
    </div>
    <div class="card">
      <h3>Churn</h3>
      <p>4.2%</p>
    </div>
    <div class="card">
      <h3>Retención</h3>
      <p>95.8%</p>
    </div>
  </div>
</section>

<!-- BUSCADOR (SOLO REDIRECCIONA) -->
<div class="search-box">
  <input type="text" placeholder="Buscar cliente (opcional)">
  <button onclick="window.location.href='perfil.html'">
    Buscar cliente
  </button>
</div>

<!-- GRAFICOS -->
<main class="content">
  <div class="charts">

    <div class="chart-box">
      <h2>Actividad semanal</h2>
      <canvas id="actividadChart"></canvas>
    </div>

    <div class="chart-box">
      <h2>Distribución de riesgo</h2>
      <canvas id="riesgoChart"></canvas>
    </div>

  </div>
</main>

<footer>
  © ChurnCheck
</footer>

<script>
new Chart(document.getElementById('actividadChart'), {
  type: 'bar',
  data: {
    labels: ['L','M','M','J','V','S','D'],
    datasets: [{
      data: [40,60,55,80,70,45,30],
      backgroundColor: '#22c55e'
    }]
  },
  options: {
    plugins: { legend: { display: false } }
  }
});

new Chart(document.getElementById('riesgoChart'), {
  type: 'doughnut',
  data: {
    labels: ['Alto','Medio','Bajo'],
    datasets: [{
      data: [30,45,25],
      backgroundColor: ['#ef4444','#f59e0b','#22c55e']
    }]
  }
});
</script>

</body>
</html>
