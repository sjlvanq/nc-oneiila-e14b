# Configuración para API ML local
external:
  prediction:
    host: "http://localhost"
    port: 8000
    endpoint: "/predict"
    api-key: "no-key-required"
    connect-timeout: 5000
    connection-timeout: 5000
    read-timeout: 5000

# Configuración del Agente IA con Azure Function
agent:
  python:
    endpoint: http://172.17.0.1:7071/api
    timeout: 30000
    max-retries: 3

logging:
  level:
    web: DEBUG

